name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -B -m unittest discover -s tests -v

      - name: Validate tag version
        shell: pwsh
        run: |
          $version = python -c "import app_info; print(app_info.VERSION)"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match app version $expectedTag"
          }

      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean world_relay.spec

      - name: Package release
        shell: pwsh
        run: |
          $version = python -c "import app_info; print(app_info.VERSION)"
          $folder = "WorldRelay-v$version"
          Copy-Item -LiteralPath "README.md" -Destination "dist/$folder/README.md"
          Copy-Item -LiteralPath "LICENSE" -Destination "dist/$folder/LICENSE"
          Compress-Archive -Path "dist/$folder" -DestinationPath "$folder-windows-x64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$folder-windows-x64.zip").Hash.ToLowerInvariant()
          "$hash  $folder-windows-x64.zip" | Set-Content -Encoding ascii "$folder-windows-x64.zip.sha256"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import app_info; print(app_info.VERSION)"
          $archive = "WorldRelay-v$version-windows-x64.zip"
          $checksum = "$archive.sha256"
          $arguments = @(
            "release", "create", $env:GITHUB_REF_NAME,
            $archive, $checksum,
            "--title", $env:GITHUB_REF_NAME,
            "--generate-notes"
          )
          if ($version.Contains("-")) {
            $arguments += "--prerelease"
          }
          & gh @arguments
